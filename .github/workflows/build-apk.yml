name: Build Period Predictor APK

on:
  push:
    branches:
      - arena/01a0b4ec-periods-predictor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest includes the Android command-line tools and SDK. Avoid
      # the third-party setup action here so builds remain reliable during the
      # hosted runner's Node runtime migrations.
      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: period-predictor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
